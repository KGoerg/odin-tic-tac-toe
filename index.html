<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <script src="javascript.js" defer></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="header">
        <h1>Welcome to Tic-Tac-Toe!</h1>
        <form action="" method="post">
            <legend>Input Player Names:</legend>

            <label for="player_one">Player One:</label>
            <input type="text" id="player_one" name="player_one" required>

            <label for="player_two">Player Two:</label>
            <input type="text" id="player_two" name="player_two" required>

            <button id="submit_button" type="button">
                Submit Names
                </button>
        </form>
        <div class="game-control-buttons">
            <button id="new-round-button">Start New Round</button>
            <button id="reset-button">Reset Players</button>
        </div>
    </div>
    <div class="announce-winner">

    </div>
    <div class="game-board-container">
        <div class="game-board">
            <button class="square" id="square-one"></button>
            <button class="square" id="square-two"></button>
            <button class="square" id="square-three"></button>
            <button class="square" id="square-four"></button>
            <button class="square" id="square-five"></button>
            <button class="square" id="square-six"></button>
            <button class="square" id="square-seven"></button>
            <button class="square" id="square-eight"></button>
            <button class="square" id="square-nine"></button>
        </div>
    </div>
</body>
</html>
